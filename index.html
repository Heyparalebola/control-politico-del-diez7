   "id": "UNGRD-A09",
   "num": 9
  },
  {
   "doc": "UNGRD-19137",
   "entidad": "UNGRD",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "10",
   "n": 1,
   "texto": "Sobre los $100.000 millones para 'subsidios de arriendo' con Fase 1 hasta el 30-sep-2026: continuidad, hogares beneficiarios, valor mensual, fuente y qué pasará con los hogares no reubicados al terminar la Fase 1.",
   "eje": "vivienda",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "No es un subsidio de arriendo sino el Apoyo Económico Temporal de la Resolución 0765 del 26-ago-2026. Lo reciben hogares damnificados directos con vivienda destruida o no habitable en el RUD. Dura tres meses sin prórroga automática (art. 7). Hay 37.580 hogares beneficiarios. El valor mensual es el 60 % del SMMLV ($1.050.543) en municipios de categoría 1, 2 y distritos, el 50 % ($875.452,50) en categoría 3 y 4 y el 45 % ($787.907,25) en categoría 5 y 6. La fuente es el FNGRD. Lo que ocurra después se definirá en el PAE, pendiente de aprobación.",
   "vacios": "No confirma ni desmiente la cifra de $100.000 millones ni da el costo total del apoyo. No desagrega los hogares por municipio ni por categoría. No precisa cuándo terminan los tres meses de cada hogar ni qué pasa con los hogares en ese momento. INFERENCIA: si el apoyo empezó a pagarse a finales de agosto de 2026, el tercer mes vencería alrededor del debate (noviembre de 2026); la fecha de inicio NO CONSTA.",
   "pagina": "8",
   "id": "UNGRD-A10",
   "num": 10
  },
  {
   "doc": "UNGRD-19137",
   "entidad": "UNGRD",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "11",
   "n": 1,
   "texto": "Funcionarios de la UNGRD que avalaron el ingreso de la delegación de rescate de Israel (~82 integrantes); justificación y protocolo; rescatados con su participación y municipios; verificación sobre el art. 173 num. 4 de la Constitución.",
   "eje": "otro",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "Decidió el Director General (E), Javier Pava Sánchez. Por el Oficio 2026EE14740 del 11-ago-2026 a Cancillería informó que no se requerían equipos USAR internacionales. Por el Oficio 2026EE14778 del 12-ago-2026 pidió complementar con equipos de Ecuador, Israel y El Salvador. Hay 23 equipos USAR nacionales acreditados y se movilizaron 16. El referente es INSARAG (Resoluciones 0683, 1525 y 382). Resultado total: 356 rescatados con vida (260 en Pereira, 88 en Cali, 8 en Quibdó) y 259 cuerpos recuperados en 12 días. La tabla territorial del reporte 098 registra 364 rescatados. La decisión fue de la Dirección General como punto focal político ante INSARAG, en coordinación con Cancillería.",
   "vacios": "No responde cuántas personas rescató la delegación de Israel ni en qué municipios operó (b). No informa el número de integrantes de esa delegación. Sobre el literal c) no dice si se consultó a Cancillería o MinDefensa la necesidad de autorización del Senado (art. 173 num. 4 C.P.); solo describe quién era la autoridad competente. Se cita la Resolución 0683 como de 2019 y como de 2018.",
   "pagina": "9",
   "id": "UNGRD-A11",
   "num": 11
  },
  {
   "doc": "UNGRD-19137",
   "entidad": "UNGRD",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "12",
   "n": 1,
   "texto": "Si la Subcuenta Sismo 2026 del FNGRD fue constituida: fecha, documento, recursos por fuente, actas de la Junta, traslados por beneficiario, plan de inversiones, saldo y mecanismos de control.",
   "eje": "recursos_presupuesto",
   "tipo": "PARCIAL",
   "traslada_a": "Ministerio de Hacienda y Crédito Público (recursos del Decreto 1261 de 2026); áreas internas de la UNGRD (otras fuentes)",
   "resumen": "La Subcuenta temporal 'SISMO 2026' fue aprobada en la Sesión Extraordinaria No. 135 de la Junta Directiva del FNGRD (Decreto 1171, art. 7; Decreto 1289 de 2018). A la fecha de corte no tiene recursos del PGN apropiados, asignados ni trasladados, y por tanto no hay compromisos ni desagregación territorial. 'Esta Oficina no cuenta con los insumos' sobre otras fuentes y sugiere consultar otras áreas internas (Cooperación Internacional, GAFC). Lo relativo al Decreto 1261 lo traslada a MinHacienda.",
   "vacios": "No da la fecha de la Sesión 135 ni remite el acta. No informa el saldo, los recursos de cooperación o donaciones, el plan de inversiones ni los mecanismos de control (literales b a f). La respuesta reconoce que la entidad no tiene información consolidada ('esta Oficina no cuenta con los insumos') y remite a dependencias internas de la propia UNGRD. No menciona la Resolución MinHacienda 2366 del 9-oct-2026, que adicionó $366.927.618.417,75 al presupuesto de la UNGRD [UNGRD 2026EE20941, p. 17], una semana antes de este oficio.",
   "pagina": "11",
   "id": "UNGRD-A12",
   "num": 12
  },
  {
   "doc": "UNGRD-19137",
   "entidad": "UNGRD",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "13",
   "n": 1,
   "texto": "Recursos destinados, apropiados, comprometidos y ejecutados en el marco del decreto de emergencia: monto, fuente, administrador, destinación, programas, territorios y porcentaje de ejecución.",
   "eje": "recursos_presupuesto",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "A la fecha, los recursos destinados al desastre del Decreto 1171 corresponden al Apoyo Económico Temporal, financiado por el FNGRD. Seis resoluciones del 27 y 28-ago-2026 ordenaron transferencias al Fondo de Inversión Colectiva de Alta Liquidez de Fiduprevisora por un total de $42.814.211.108: Quindío, Cali, Valle del Cauca, Risaralda, Caldas y Chocó.",
   "vacios": "No da el porcentaje de ejecución ni los pagos efectivos a hogares. Omite las adiciones del 8 y 9-oct-2026 (Resoluciones 0887 a 0891 y 0898), que la UNGRD lista en su respuesta del 6-nov [2026EE20941, p. 17] y que son anteriores a este oficio. No incluye AHE, USAR ni otros gastos. No precisa de qué subcuenta del FNGRD salieron las transferencias, dado que la Subcuenta SISMO 2026 no tenía recursos (pregunta 12).",
   "pagina": "13",
   "id": "UNGRD-A13",
   "num": 13
  },
  {
   "doc": "UNGRD-19137",
   "entidad": "UNGRD",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "14",
   "n": 1,
   "texto": "Criterio técnico y fuente para incluir a Putumayo en el Decreto 1261 de 2026 y excluirlo en el Decreto 1348 de 2026, qué cambió entre el 19 y el 31-ago, y criterio para incluir a Caquetá y Santander.",
   "eje": "articulacion_territorial",
   "tipo": "NO RESPONDE",
   "traslada_a": null,
   "resumen": "Responde sobre el Decreto 1171 (desastre), no sobre los Decretos 1261 y 1348 (emergencia económica) que se preguntaban. Ese ámbito se fijó el mismo día del sismo de magnitud 7,4 Mw con un criterio de 'cobertura preventiva'. Putumayo reportó afectación en dos centros educativos de Mocoa y Villagarzón, la desestimó después y no tiene hogares en el RUD. Sobre Caquetá y Santander dice que el soporte fue la consolidación preliminar de la Sala de Crisis, no EDAN por departamento.",
   "vacios": "Cambia el objeto de la pregunta: los Decretos 1261 y 1348 no se analizan. No remite los reportes pedidos ni explica qué cambió entre el 19 y el 31-ago. No da criterio específico para Caquetá ni para Santander. La versión sobre Putumayo varía entre oficios. Aquí: 'dos centros educativos'. El 3-oct: reporte del 10-ago por WhatsApp y base del 14-ago [2026EE18037, p. 6]. El 6-nov: fisuras descartadas por el CDGRD el 20-ago [2026EE20941, p. 9].",
   "pagina": "13",
   "id": "UNGRD-A14",
   "num": 14
  },
  {
   "doc": "UNGRD-19137",
   "entidad": "UNGRD",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "15",
   "n": 1,
   "texto": "Criterios de priorización y acciones en cada uno de los 16 departamentos del Estado de Emergencia: tipo de intervención, monto, cronograma, ejecutor, proporcionalidad frente a la afectación, entidades nacionales participantes y acciones adicionales en Santander.",
   "eje": "recursos_presupuesto",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "Enuncia criterios generales: magnitud de afectaciones, vulnerabilidad (categoría 5 y 6, NBI, IPM), PDET, comunidades étnicas e instrumentos desactualizados. Los montos, la proporcionalidad y los cronogramas por departamento estarían en el PAE, 'en proceso de estructuración' y pendiente de aprobación. Lista entidades participantes de forma genérica. Para Santander no hay acciones adicionales identificadas, solo la regla general.",
   "vacios": "No nombra los 16 departamentos ni da cifras por departamento. No hay análisis de proporcionalidad. Hay una contradicción interna: la pregunta 7 dice que el PAE 'ya se encuentra formulado' [p. 8] y la 15 que está 'en proceso de estructuración' [p. 15].",
   "pagina": "14",
   "id": "UNGRD-A15",
   "num": 15
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "1",
   "n": 1,
   "texto": "¿Cómo se está coordinando el Ministerio de Salud y Protección Social con la UNGRD para el seguimiento de la información, los reportes y la construcción del PAE de los departamentos afectados?",
   "eje": "PAE",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "Expone el marco de competencias (Decreto 120 de 2026; Ley 1523 de 2012) y cuatro ejes de respuesta: PMU y salud ambiental en alojamientos, vigilancia epidemiológica, recuperación de la red de IPS y monitoreo a las EAPB. Dice haber participado en las instancias de la UNGRD donde se revisaron las acciones del sector para el PAE. Estructuró, costeó y socializó un Plan de Acción Institucional con las secretarías de los departamentos priorizados. El 11-ago-2026 envió 255 kg de medicamentos e insumos a Chocó y 255 kg a Buenaventura. Hace seguimiento a la capacidad de la red con reportes del COE.",
   "vacios": "No da fechas, número de mesas con la UNGRD ni las acciones del sector salud que entraron al PAE. Dice que el Plan de Acción Institucional fue 'costeado' [p. 6], pero no informa su valor, líneas ni fecha de adopción. Las 4 primeras páginas son marco normativo.",
   "pagina": "4",
   "id": "MSPS-P01",
   "num": 1
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "2",
   "n": 1,
   "texto": "Informe cuál es el rol del Ministerio de Salud y Protección Social en la creación del 'Fondo milagro'.",
   "eje": "recursos_presupuesto",
   "tipo": "COMPLETA",
   "traslada_a": "Ministerio de Hacienda y Crédito Público (constitución y administración del Fondo; no es traslado formal)",
   "resumen": "El Fondo Milagro fue creado por el Decreto Legislativo 1379 de 2026, expedido por el Gobierno, del que el Ministerio hace parte. Su constitución y administración corresponden a MinHacienda. Como el art. 3 num. 4 del decreto permite financiar infraestructura de salud, el MSPS aporta información sobre afectaciones y necesidades de la red para priorizar, sin administrar, ejecutar ni disponer de recursos.",
   "vacios": "No dice si el MSPS ya remitió información o proyectos al Fondo Milagro, ni en qué fecha.",
   "pagina": "9",
   "id": "MSPS-P02",
   "num": 2
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "3",
   "n": 1,
   "texto": "Departamentos y municipios que aún no han culminado o remitido sus EDAN de infraestructura y funcionamiento de IPS, las razones y el acompañamiento técnico del Ministerio para su consolidación.",
   "eje": "EDAN",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "Por dificultades de acceso y conectividad, los territorios siguen reportando novedades a las secretarías departamentales. La Dirección de Infraestructura y Dotación fijó el 15-oct-2026 como plazo para recibir información complementaria. Después de esa fecha, el MSPS y la UNGRD consolidan y hacen una evaluación preliminar. Con corte al 20-oct-2026 no hay reporte de Norte de Santander, y no se sabe si es por ausencia de afectaciones o por EDAN pendiente.",
   "vacios": "Solo identifica a Norte de Santander. No lista otros departamentos o municipios con EDAN pendientes, no da razones por territorio ni describe el acompañamiento técnico. La comunicación con plazo al 15-oct-2026 se cita sin radicado ni fecha.",
   "pagina": "9",
   "id": "MSPS-P03",
   "num": 3
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "4",
   "n": 1,
   "texto": "Indique qué acciones se han adelantado por este ministerio para suplir las necesidades en infraestructura y funcionamiento de instituciones prestadoras de servicios de salud.",
   "eje": "salud",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "Con las secretarías clasifica el nivel de afectación de las IPS (leve, moderado, severo, reposición parcial, reposición total) y define si los servicios continúan o deben trasladarse. Da asistencia técnica para planes de contingencia. Gestiona ofrecimientos de cooperación y donaciones (carpas, equipos, insumos), con ingreso según el Decreto 1327 de 2026. El Decreto Legislativo 1415 de 2026 habilita a las entidades territoriales y a la ADRES para financiar la recuperación de la red pública.",
   "vacios": "No hay cifras de IPS por nivel de afectación, servicios trasladados, planes de contingencia aprobados, carpas o equipos entregados, ni recursos movilizados con el Decreto 1415. No informa qué IPS reciben donaciones ni en qué cantidad.",
   "pagina": "10",
   "id": "MSPS-P04",
   "num": 4
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "5",
   "n": 1,
   "texto": "¿Qué seguimiento y control hará el Ministerio de Salud y Protección Social para el manejo de los recursos entregados a los entes territoriales?",
   "eje": "recursos_presupuesto",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": "Entidades territoriales (ejecución y control de recursos propios; no es traslado formal)",
   "resumen": "El control depende de la fuente y el mecanismo de cada recurso. Las medidas extraordinarias para la red pública recaen principalmente sobre recursos propios de las entidades territoriales, que las ejecutan y controlan. El MSPS revisa y valida técnicamente las intervenciones que se le presenten.",
   "vacios": "No describe ningún mecanismo concreto: informes, periodicidad o indicadores. No dice si el MSPS ha transferido recursos a los territorios por el sismo.",
   "pagina": "10",
   "id": "MSPS-P05",
   "num": 5
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "6",
   "n": 1,
   "texto": "Informe el estado actual de daños en infraestructuras de IPS (averiadas, destruidas y en funcionamiento) por municipio y departamento.",
   "eje": "salud",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "Tabla 1, con corte al 20-oct-2026: 683 sedes reportadas en 260 municipios de 16 departamentos. 479 requieren intervención y 204 no. Valle del Cauca (incluye Cali y Buenaventura) concentra 173 sedes que requieren intervención y Chocó 84. Putumayo aparece por reporte territorial, sin que el MSPS se pronuncie sobre la causalidad. Norte de Santander no registra reportes.",
   "vacios": "No hay desagregación municipal: solo número de municipios por departamento. No usa las categorías pedidas (averiadas, destruidas, en funcionamiento), sino 'requieren o no requieren intervención', aunque en la p. 10 dice clasificar en leve, moderado, severo y reposición parcial o total. El texto anuncia 'metros cuadrados objeto de intervención' [p. 11], pero la tabla no los trae. Excluye los requerimientos de dotación biomédica (nota de la tabla, p. 12). No informa cuántas sedes están cerradas o fuera de servicio.",
   "pagina": "11",
   "id": "MSPS-P06",
   "num": 6
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "7",
   "n": 1,
   "texto": "Informe el estado actual de formulación del PAE derivado del terremoto del 10 de agosto de 2026 para el sector salud.",
   "eje": "PAE",
   "tipo": "TRASLADO POR COMPETENCIA",
   "traslada_a": "Unidad Nacional para la Gestión del Riesgo de Desastres (UNGRD)",
   "resumen": "Según el art. 61 de la Ley 1523, el PAE de un desastre nacional lo elabora la UNGRD, que debe informar su estado. Para el sector salud, el MSPS estructuró, costeó y socializó un Plan de Acción Institucional, cuyas acciones se presentaron en las instancias de la UNGRD para incorporarlas al PAE.",
   "vacios": "No dice si las acciones de salud quedaron en el PAE ni con qué metas, montos o plazos. No menciona la aprobación del PAE por el CNGRD el 15-oct-2026, que la UNGRD informa [UNGRD 2026EE20941, pp. 11, 13, 16], aunque esta respuesta es posterior (23-oct-2026). No informa el valor del Plan de Acción Institucional 'costeado'.",
   "pagina": "12",
   "id": "MSPS-P07",
   "num": 7
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "8",
   "n": 1,
   "texto": "Monto total que el Ministerio de Salud ha destinado, comprometido y ejecutado con ocasión del terremoto del 10 de agosto de 2026, discriminado por concepto, departamento y municipio.",
   "eje": "recursos_presupuesto",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "Las inversiones para recuperar la infraestructura hospitalaria dependen de la consolidación definitiva de afectaciones y de las evaluaciones técnicas territoriales. El MSPS no ha definido ni comprometido recursos para esa infraestructura ni registra ejecución por ese concepto, por lo que no puede discriminar por concepto o territorio.",
   "vacios": "Se limita a la infraestructura hospitalaria, aunque la pregunta pide el total con ocasión del terremoto. No informa el costo de lo efectivamente hecho: despachos de medicamentos (510 kg), el Plan SMAPS, la vigilancia epidemiológica, el traslado aéreo de pacientes o el Plan de Acción Institucional 'costeado'. No informa recursos movilizados con el Decreto Legislativo 1415 de 2026.",
   "pagina": "12",
   "id": "MSPS-P08",
   "num": 8
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "9",
   "n": 1,
   "texto": "Acciones del Ministerio para garantizar el envío y abastecimiento de medicamentos, insumos y dispositivos médicos a la población afectada; departamentos y municipios atendidos y necesidades pendientes.",
   "eje": "salud",
   "tipo": "PARCIAL",
   "traslada_a": "Entidades Administradoras de Planes de Beneficios – EAPB/EPS (garantía directa del suministro; no es traslado formal)",
   "resumen": "Expone en extenso que el suministro corresponde a las EAPB y que el MSPS no puede intervenir directamente en producción o distribución. Hizo seguimiento a laboratorios: respondieron 192, 152 sin daños y 40 con novedades (casos de Tecnoquímicas, GSK, Genfar, Silimed y otros). Hizo seguimiento a gestores farmacéuticos: de 96, respondieron 22; de 337 puntos de dispensación, 246 con afectación. El 12-ago se reunió con gestores y productores de gases medicinales; las necesidades se elevaron al PMU Nacional, que normalizó la movilidad y el oxígeno (Air Liquide). Expidió la Circular Externa 0028, la Circular 030 y el Decreto 1327 de 2026. Concluye que no hay desabastecimiento ni riesgo de desabastecimiento en los municipios afectados.",
   "vacios": "No lista departamentos y municipios atendidos ni necesidades pendientes, que eran lo pedido. Los datos de laboratorios y dispensarios no tienen fecha de corte y parecen tomados de un informe de agosto: hablan de restricciones previstas por 'aproximadamente una semana' y de reuniones del 12-ago. No informa cuántos de los 246 puntos de dispensación afectados siguen cerrados al 23-oct, ni los resultados de la Circular 0028. Cerca de 5 de las 9 páginas son marco normativo.",
   "pagina": "13",
   "id": "MSPS-P09",
   "num": 9
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "10",
   "n": 1,
   "texto": "Medidas para garantizar la disponibilidad de sangre y hemocomponentes en las zonas afectadas y articulación del Ministerio con bancos de sangre y redes de servicios de salud.",
   "eje": "salud",
   "tipo": "COMPLETA",
   "traslada_a": null,
   "resumen": "Con datos del INS: el sistema SIHEVI-INS cubre 82 bancos y 642 IPS, y desde 2025 el módulo CRH exige notificación diaria. Hubo alerta previa por el volcán Puracé. El 10-ago se contactó a 5 coordinaciones departamentales y 10 bancos en zona afectada, y se evaluaron 74 IPS con actividad transfusional. Las alertas se atendieron con envíos desde bancos de Bogotá en vuelos humanitarios, 'logrando suplir la totalidad de los requerimientos'. Del 10 al 14-ago hubo en promedio unos 6.000 donantes potenciales diarios, frente a cerca de 2.500 habituales. La Tabla 3 muestra glóbulos rojos disponibles del 10-ago al 2-sep-2026.",
   "vacios": "La serie de la Tabla 3 termina el 2-sep-2026, 51 días antes de la respuesta. No informa cuántas alertas se generaron, cuántas unidades se enviaron ni cuántos vuelos humanitarios hubo. Chocó no reporta disponibilidad los días 10, 22 y 29-ago y registra 0 unidades el 30-ago, sin explicación. Las instrucciones del módulo CRH anunciadas como adjunto no están en el PDF.",
   "pagina": "21",
   "id": "MSPS-P10",
   "num": 10
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "11",
   "n": 1,
   "texto": "Acciones para atender la salud mental de la población damnificada, en particular NNA, personas mayores y familias que perdieron vivienda o medios de vida: estrategias, territorios priorizados y recursos destinados.",
   "eje": "salud_mental",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "La Dirección de Salud Mental y Convivencia activó un Plan de Respuesta Nacional en Salud Mental y Apoyo Psicosocial (SMAPS), publicado en la web. Prioriza 5 departamentos (Chocó, Risaralda, Valle del Cauca, Caldas, Quindío) y los distritos de Cali y Buenaventura, con énfasis en NNA, personas mayores, comunidades étnicas del Chocó, familiares de desaparecidos, primeros respondientes y la población de Buenaventura y el Pacífico rural. Tiene cuatro fases; desde octubre está en Estabilización y recuperación temprana. Sus tres líneas son gobernanza, fortalecimiento institucional y monitoreo. Resultados al 16-oct-2026: 7 sesiones del PMU SMAPS con más de 50 actores, 168 entidades mapeadas, 14 tipologías de brechas, 24 asistencias técnicas con 5.503 personas conectadas, 164 casos gestionados con Supersalud, 14.867 atenciones individuales y 24.583 personas en acciones colectivas. Propone una Estrategia de Intervención Territorial con cinco líneas.",
   "vacios": "No informa recursos destinados a SMAPS, aunque la pregunta los pide expresamente. Las atenciones no se desagregan por territorio, edad (NNA, personas mayores) ni etnia. La Estrategia de Intervención Territorial está 'propuesta', sin fecha ni financiación. No hay acciones específicas para familias que perdieron medios de vida. La priorización (5 departamentos) deja por fuera territorios con IPS afectadas según la Tabla 1, como Tolima, Antioquia y Cauca.",
   "pagina": "23",
   "id": "MSPS-P11",
   "num": 11
  },
  {
   "doc": "MSPS-4033281",
   "entidad": "MSPS",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "12",
   "n": 1,
   "texto": "Acciones, protocolos y estrategias del Ministerio para identificar, caracterizar y atender integralmente las afectaciones en salud física derivadas del terremoto, y cómo garantiza su implementación territorial.",
   "eje": "salud",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "Al 16-oct-2026 el COE Salud registra 3.894 lesionados atendidos, frente a 4.516 que reporta la UNGRD; la diferencia se atribuye a distintas fuentes y metodologías. Describe los instrumentos: triage (Resolución 5596 de 2015), CRUE, referencia y contrarreferencia (Resolución 1220 de 2010), planes hospitalarios y vigilancia SIVIGILA. El MSPS coordinó el traslado de pacientes críticos con apoyo de la FAC. 479 establecimientos de salud afectados. Al 16-oct funcionaban 40 alojamientos temporales en siete departamentos y distritos, con acciones de salud ambiental. Los laboratorios de salud pública de Quindío, Risaralda y Caldas permanecieron cerrados y el del Valle suspendió actividades. En la semana epidemiológica 32 la notificación fue del 99,94 %.",
   "vacios": "No desagrega los lesionados por territorio, gravedad, edad ni sexo, ni informa fallecidos atendidos. No dice cuántos pacientes críticos se trasladaron ni cuántos con la FAC. Reconoce que el registro de triage 'debería ser el insumo' de la caracterización [p. 29], es decir, que la caracterización clínica no está consolidada. No informa brotes ni eventos detectados. No identifica los 7 territorios con alojamientos ni dice si los laboratorios ya reabrieron.",
   "pagina": "28",
   "id": "MSPS-P12",
   "num": 12
  },
  {
   "doc": "MHCP-072232",
   "entidad": "MHCP",
   "grupo": "sismo",
   "cuestionario": "Principal y aditiva",
   "numero": "1, 6 y 7 (principal) y 3 (aditiva)",
   "n": 4,
   "texto": "1: coordinación con la UNGRD para el PAE. 6: criterios de priorización de recursos. 7: recursos adicionales para el PAE y estrategia de financiación. Aditiva 3: donaciones recibidas por MinHacienda, el Gobierno o el FNGRD.",
   "eje": "recursos_presupuesto",
   "tipo": "TRASLADO POR COMPETENCIA",
   "traslada_a": "UNGRD (principales 1, 6 y 7) y APC (aditiva 3)",
   "resumen": "Se declaran trasladadas a la UNGRD y a la APC mediante los oficios 2-2026-064210 y 2-2026-069637.",
   "vacios": "La pregunta 7 (estrategia del Gobierno para financiar el PAE) y la aditiva 3 (donaciones recibidas por el propio MinHacienda) quedan sin respuesta del Ministerio. Ver los traslados del mismo expediente.",
   "pagina": "1",
   "id": "MHCP-PA01",
   "num": 1
  },
  {
   "doc": "MHCP-072232",
   "entidad": "MHCP",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "2 (principal)",
   "n": 1,
   "texto": "Informe cuál es el rol del Ministerio de Hacienda y Crédito Público en la creación del 'Fondo milagro'.",
   "eje": "recursos_presupuesto",
   "tipo": "COMPLETA",
   "traslada_a": null,
   "resumen": "Según el art. 1 del Decreto 1379 de 2026, MinHacienda constituye el patrimonio autónomo por fiducia mercantil, que puede hacerse con una fiduciaria pública designada directamente. El 5-oct-2026 se firmó el Contrato de Fiducia 6.001-2026 con Fiducoldex, con MinHacienda como único fideicomitente. MinHacienda tiene un asiento en el Consejo Directivo y ejerce la Secretaría Técnica. Por medio de la Dirección de Crédito Público y Tesoro administra los recursos en la Cuenta Única Nacional, los rentabiliza y gira directamente al beneficiario final por SIIF, con órdenes validadas por Fiducoldex y el Gerente. No tiene funciones de estructuración, priorización ni ordenación del gasto.",
   "vacios": "No informa la comisión fiduciaria pactada ni el valor del contrato. Solo remite al enlace de SECOP. No explica por qué se designó directamente a Fiducoldex.",
   "pagina": "1",
   "id": "MHCP-P02",
   "num": 2
  },
  {
   "doc": "MHCP-072232",
   "entidad": "MHCP",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "3 (principal)",
   "n": 1,
   "texto": "¿Qué seguimiento y control hará el Ministerio de Hacienda y Crédito Público al control y manejo de los recursos entregados a los entes territoriales?",
   "eje": "recursos_presupuesto",
   "tipo": "NO RESPONDE",
   "traslada_a": null,
   "resumen": "Se agrupa en una 'respuesta conjunta' con las preguntas 4 y 5, pero el texto no se refiere al seguimiento ni al control de recursos entregados a entes territoriales.",
   "vacios": "La pregunta queda sin respuesta. La única mención afín es que MinHacienda se limita al seguimiento financiero y de tesorería en SIIF y la Cuenta Única Nacional, y se hace a propósito del Fondo Milagro (pregunta 2) [p. 3].",
   "pagina": "3",
   "id": "MHCP-P03",
   "num": 3
  },
  {
   "doc": "MHCP-072232",
   "entidad": "MHCP",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "4 y 5 (principal, respuesta conjunta)",
   "n": 2,
   "texto": "4: modificaciones, adiciones o traslados presupuestales hechos o previstos para la atención y recuperación, con recursos y destinación. 5: recursos del PGN disponibles para la emergencia y para la reconstrucción, por fuente y sector.",
   "eje": "recursos_presupuesto",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "El Decreto 1261 prevé múltiples fuentes. Hay un esquema preliminar en dos etapas: primeros seis meses y vigencia 2027. La cuantificación preliminar de los decretos legislativos es de $19,2 billones: $17,5 billones de reconstrucción, casi todo del Decreto 1422 de 2026 (MinVivienda), y $1,7 billones de atención inmediata (Trabajo $0,7, Salud $0,5, Prosperidad Social $0,4 y Transporte $0,15 billones). Ese valor es una estimación, no un costo fiscal adicional: se atiende primero con las apropiaciones vigentes de cada entidad y, si no alcanzan, con el Fondo Milagro. No hay consolidación definitiva del PGN asignado a la emergencia. El Decreto 1412 de 2026 incorporó $624.656.000.000 del Empréstito Externo 9774-CO a la sección 1301-01, y el Decreto 1488 de 2026 los liquidó a favor del Fondo Milagro sin salida de efectivo.",
   "vacios": "No relaciona todas las modificaciones presupuestales. Omite la Resolución MinHacienda 2366 del 9-oct-2026, que adicionó $366.927.618.417,75 al presupuesto de la UNGRD según la propia UNGRD [2026EE20941, p. 17], una semana antes de este oficio. No desagrega por sector ni por fuente. No da el prestamista ni las condiciones del empréstito 9774-CO (tasa, plazo, gracia), que pide la aditiva del Fondo Milagro [OD, p. 16]. No da el monto del PGN 2027.",
   "pagina": "3",
   "id": "MHCP-P04",
   "num": 4
  },
  {
   "doc": "MHCP-072232",
   "entidad": "MHCP",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "1 (aditiva)",
   "n": 1,
   "texto": "Diferencias entre el modelo del Fondo Adaptación (Decreto 4819 de 2010, Sentencia C-251 de 2011) y el del 'Fondo Milagro' y otros mecanismos, incluida la referencia al FOREC (1999).",
   "eje": "recursos_presupuesto",
   "tipo": "COMPLETA",
   "traslada_a": null,
   "resumen": "Presenta un cuadro comparativo entre el Fondo Adaptación, el FOREC (Decreto 197 de 1999) y el Fondo Milagro (Decreto 1379 de 2026) por naturaleza jurídica, personería, objeto, órgano de dirección, gerencia, régimen contractual, administración de recursos, fuentes, auditoría y duración. Destaca tres diferencias del Fondo Milagro: objeto exclusivo del sismo, multiplicidad de fuentes y recursos en la Cuenta Única Nacional con giro directo. Según el cuadro, el Consejo Directivo del Fondo Milagro tiene 5 representantes del Presidente, 1 delegado del DNP, 1 de MinHacienda y 1 de la UNGRD con voz sin voto, y el gerente lo designa el Presidente y lo contrata la fiduciaria.",
   "vacios": "No explica por qué se descartó usar el Fondo Adaptación, ya existente, ni la razón técnica de crear un nuevo patrimonio autónomo. El cuadro no compara costos de operación.",
   "pagina": "5",
   "id": "MHCP-A01",
   "num": 1
  },
  {
   "doc": "MHCP-072232",
   "entidad": "MHCP",
   "grupo": "sismo",
   "cuestionario": "Aditiva 8-sep",
   "numero": "2 (aditiva)",
   "n": 1,
   "texto": "Según el art. 6 del Decreto 1171 de 2026, cómo se distribuirá el monto reportado por los municipios: criterios de priorización, monto por municipio y cronograma de giro, en relación con el art. 8 del decreto y el art. 59 de la Ley 1523 de 2012.",
   "eje": "recursos_presupuesto",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": "Ordenadores del gasto de cada sección presupuestal (implícito)",
   "resumen": "Por la autonomía presupuestal (Decreto 111 de 1996, art. 110, modificado por la Ley 2294 de 2023, art. 337), ordenar el gasto corresponde a cada órgano. MinHacienda solo gestiona la tesorería y el PAC para situar recursos por SIIF una vez el ordenador del gasto lo instruya.",
   "vacios": "No se refiere a la obligación del art. 6 del Decreto 1171 de garantizar 'de manera inmediata' recursos suficientes al FNGRD. No dice cuánto se giró al FNGRD ni con qué cronograma. La UNGRD informó el 16-oct que la Subcuenta SISMO 2026 no había recibido recursos del PGN [2026EE19137, p. 12].",
   "pagina": "8",
   "id": "MHCP-A02",
   "num": 2
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "1",
   "n": 1,
   "texto": "¿Cómo se está coordinando el MVCT con la UNGRD para el seguimiento de la información, los reportes y la construcción del PAE de los departamentos afectados?",
   "eje": "PAE",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "El MVCT actúa como autoridad sectorial (Decreto Ley 3571 de 2011, modificado por el Decreto 1604 de 2020), y el PAE corresponde a la UNGRD (Ley 1523, art. 61). Enumera cinco tipos de actuación: Sala de Crisis y PMU, intercambio de información, asistencia técnica y visitas, alternativas sectoriales y remisión de insumos. Creó el Formulario de Evaluación de Daños y Habitabilidad de Edificaciones Afectadas por Sismo y usa Survey123 para agua y saneamiento.",
   "vacios": "No da fechas, mesas ni productos entregados. No menciona las mesas del 18 y 28-sep ni la base RUD-EDAN del 19-sep que la UNGRD dice haber compartido con el MVCT [2026EE20941, p. 12].",
   "pagina": "1",
   "id": "MVCT-P01",
   "num": 1
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "2",
   "n": 1,
   "texto": "Informe cuál es el rol del Ministerio de Vivienda, Ciudad y Territorio en la creación del 'Fondo milagro'.",
   "eje": "recursos_presupuesto",
   "tipo": "COMPLETA",
   "traslada_a": null,
   "resumen": "El Decreto 1379 del 9-sep-2026 creó el Fondo Milagro como patrimonio autónomo de MinHacienda (fuentes en el art. 4, Cuenta Única en el art. 6, Consejo Directivo en el art. 7 y gerente en los arts. 8 y 9). El MVCT participó en su estructuración de forma técnica, normativa y sectorial: hizo observaciones, revisó alternativas de financiación, trasladó necesidades de mesas de trabajo y promovió la articulación con el PAE, la UNGRD y Fonvivienda.",
   "vacios": "No dice si el MVCT tiene asiento en el Consejo Directivo. Según el cuadro de MinHacienda, no lo tiene [MHCP 2-2026-072232, p. 6].",
   "pagina": "2",
   "id": "MVCT-P02",
   "num": 2
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "3",
   "n": 1,
   "texto": "Departamentos y municipios que no han culminado o remitido sus evaluaciones de daños en viviendas, las razones y el acompañamiento técnico del Ministerio para su consolidación.",
   "eje": "EDAN",
   "tipo": "TRASLADO POR COMPETENCIA",
   "traslada_a": "Unidad Nacional para la Gestión del Riesgo de Desastres (UNGRD)",
   "resumen": "El MVCT no elabora censos, no administra el RUD ni consolida afectaciones. La EDAN es territorial (Decreto 1077 de 2015). La pregunta se trasladó a la UNGRD con el radicado 2026EE0053434.",
   "vacios": "No informa el acompañamiento técnico del propio MVCT, aunque en las preguntas 1 y 10 dice haber socializado un formulario y hecho visitas. Repite la mención a 'preguntas 51-54' y 'pregunta 55', que no existen en este cuestionario.",
   "pagina": "3",
   "id": "MVCT-P03",
   "num": 3
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "4",
   "n": 1,
   "texto": "Indique qué acciones se han adelantado por este ministerio para suplir las necesidades en viviendas en los municipios afectados.",
   "eje": "vivienda",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "Se trabaja 'de manera ininterrumpida' en redactar decretos legislativos sectoriales derivados del Decreto 1261 de 2026, que fijarán valor del subsidio, apropiaciones, procedimientos interoperables con el RUD, duración de apoyos transitorios, convocatorias y esquemas fiduciarios. También se evalúan medidas de ordenamiento territorial, sismorresistencia y proyectos urbanos integrales, y se brindará asistencia técnica para identificar suelo apto.",
   "vacios": "A 50 días del sismo no informa ninguna acción ejecutada en vivienda: ni subsidios asignados, ni hogares atendidos, ni recursos. Todo son medidas en preparación. No menciona el Apoyo Económico Temporal de la UNGRD (Resolución 0765 del 26-ago-2026; 37.580 hogares) [UNGRD 2026EE19137, p. 9].",
   "pagina": "4",
   "id": "MVCT-P04",
   "num": 4
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "5",
   "n": 1,
   "texto": "¿Qué seguimiento y control hará el Ministerio de Vivienda, Ciudad y Territorio para el manejo de los recursos entregados a los entes territoriales?",
   "eje": "recursos_presupuesto",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "El MVCT no es órgano de control (art. 287 C.P.). Cuando haya recursos del sector transferidos, cofinanciados o ejecutados por convenios, patrimonios autónomos o subsidios, el MVCT o Fonvivienda aplicarán ocho mecanismos: destinación específica, informes, verificación de beneficiarios, supervisión o interventoría, trazabilidad, cruces, avance físico y financiero, y medidas correctivas o reintegros. Para el SGP de agua se aplica el Decreto Ley 028 de 2008. Describe además el esquema de control del Fondo Milagro (Consejo, gerente y auditoría independiente del art. 10).",
   "vacios": "Es condicional ('cuando existan recursos'). No dice si el MVCT ha transferido algún recurso por el sismo.",
   "pagina": "5",
   "id": "MVCT-P05",
   "num": 5
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "6",
   "n": 1,
   "texto": "Informe el estado actual de daños en infraestructuras de vivienda reportados (averiadas, destruidas y en funcionamiento) por municipio y departamento.",
   "eje": "vivienda",
   "tipo": "TRASLADO POR COMPETENCIA",
   "traslada_a": "Unidad Nacional para la Gestión del Riesgo de Desastres (UNGRD)",
   "resumen": "Repite el texto de la pregunta 3: el MVCT no consolida afectaciones y la pregunta se trasladó a la UNGRD (2026EE0053434).",
   "vacios": "El MVCT dice llevar un 'registro sectorial de afectaciones' de vivienda con su propio formulario [pp. 2, 5, 7], pero no comparte ninguna cifra de ese registro. En los oficios de la UNGRD revisados NO CONSTA respuesta por municipio sobre daños en vivienda.",
   "pagina": "6",
   "id": "MVCT-P06",
   "num": 6
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "7",
   "n": 1,
   "texto": "Informe el estado actual de formulación del PAE derivado del terremoto del 10 de agosto de 2026 para el sector Vivienda.",
   "eje": "PAE",
   "tipo": "PARCIAL",
   "traslada_a": "Unidad Nacional para la Gestión del Riesgo de Desastres (UNGRD) – traslado parcial",
   "resumen": "El PAE lo elabora la UNGRD y el MVCT aporta insumos sectoriales: registro de afectaciones, formulario de habitabilidad, datos de agua por Survey123, visitas y alternativas. Distingue el PAE (instrumento legal), el 'Plan Milagro de Reconstrucción' (estrategia gubernamental) y el Fondo Milagro (vehículo financiero). Traslado parcial a la UNGRD (2026EE0053434).",
   "vacios": "No da el estado del componente de vivienda (metas, soluciones, montos). Introduce un 'Plan Milagro de Reconstrucción' que no está definido en ningún acto citado.",
   "pagina": "6",
   "id": "MVCT-P07",
   "num": 7
  },
  {
   "doc": "MVCT-0058805",
   "entidad": "MVCT",
   "grupo": "sismo",
   "cuestionario": "Principal",
   "numero": "8",
   "n": 1,
   "texto": "Monto total que el MVCT ha destinado, comprometido y ejecutado con ocasión del terremoto del 10 de agosto de 2026, discriminado por concepto, departamento y municipio.",
   "eje": "recursos_presupuesto",
   "tipo": "NO RESPONDE",
   "traslada_a": null,
   "resumen": "El MVCT participó en estructurar el Fondo Milagro y en medidas para ampliar la financiación de VIS y VIP. Menciona fuentes posibles: PGN, donaciones, crédito, regalías, SGP, obras por impuestos y obras por regalías. Los montos se reportarán cuando se consolide la EDAN y se incorporen al PAE.",

   "resumen": "La administración y el seguimiento de los albergues no corresponden al MVCT, sino al SNGRD y a los territorios. El MVCT solo atiende componentes de vivienda y agua. La Dirección de Espacio Urbano y Territorial hizo una comisión a Chocó (Quibdó, Cértegui, Atrato, Unión Panamericana y Tadó) para verificar viviendas, sin evaluar albergues.",

   "n": 1,
   "texto": "Acciones con entes territoriales y prestadores para restablecer acueducto, alcantarillado y demás servicios; municipios aún afectados, acciones implementadas y cronograma de restablecimiento.",

   "resumen": "Con corte al 31-ago-2026 hay 137 municipios con afectación en acueducto, alcantarillado o aseo; el listado nominal está en el Anexo 2. El MVCT participa en Sala de Crisis y PMU, se comunica con los PDA y prestadores, da asistencia para la EDAN sectorial y usa Survey123. El registro 'no permite establecer' que 'los 93 municipios' sigan con interrupciones. El restablecimiento corresponde a los prestadores con sus Planes de Emergencia y Contingencia (Resolución 154 de 2014), y el cronograma se define caso a caso.",
   "vacios": "No hay cronograma de restablecimiento. Los datos tienen corte al 31-ago, 29 días antes del oficio. El texto no explica qué son los '93 municipios'; solo el anexo los identifica como pendientes de restablecimiento. No informa recursos para rehabilitar la infraestructura, aunque el anexo trae costos estimados por $56.184 millones (cálculo propio).",

   "texto": "Informe el número de personas y hogares inscritos a la fecha en el RUD con ocasión del terremoto del 10 de agosto de 2026, discriminado por departamento y municipio.",

   "vacios": "REMISIÓN SIN RESPUESTA SUSTANTIVA: el oficio no trae ninguna cifra. Habla de 'cargue activo' aunque el RUD había cerrado el 4-sep-2026, un mes antes del oficio.",

   "n": 1,
   "texto": "¿Cuál es el procedimiento y cuáles son los criterios establecidos para la identificación, caracterización, inscripción y validación de las personas y hogares damnificados en el RUD?",

   "traslada_a": null,
   "resumen": "El RUD se rige por la Resolución 1256 de 2013, modificada por la Resolución 1190 de 2016. Los territorios registran con usuario y contraseña asignados por la UNGRD.",

   "eje": "censo_RUD_RUPE",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "El RUD cerró el 4-sep-2026 a las 23:59. Después siguió una auditoría técnica con cruce con la Registraduría. Las dificultades fueron de conectividad, telecomunicaciones y energía. Los criterios de inclusión y exclusión son de los territorios (Resolución 1190 de 2016, art. 4 lit. b).",

   "texto": "4: mecanismos para incluir en el RUD a damnificados no incorporados a tiempo por acceso, conectividad, desplazamiento o pérdida de documentos. 5: cómo se usa el RUD para priorizar ayudas, alojamientos y demás medidas de atención.",
   "eje": "censo_RUD_RUPE",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "La EDAN y el censo RUD competen a los CMGRD y CDGRD. 'La plataforma del RUD estará habilitada para el registro oficial hasta el 04 de septiembre de 2026.' La lista de municipios pendientes depende del cargue en ese plazo. Hay personal en Cali, Chocó y el Eje Cafetero para verificar y entregar ayudas humanitarias de emergencia, y las acciones se programan a medida que cada alcaldía cargue sus reportes.",
   "vacios": "Usa tiempo futuro ('estará habilitada hasta el 04 de septiembre') en un oficio del 3-oct. INFERENCIA: el texto se redactó antes del 4-sep y no se actualizó. No hay mecanismo para incluir personas después del cierre ni cifras de ayudas entregadas según el RUD.",

   "n": 1,
   "texto": "¿Qué mecanismos de verificación, actualización y depuración se han implementado para garantizar la confiabilidad del RUD y evitar duplicidades, exclusiones o registros indebidos?",

   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "Hay tres controles: la plataforma impide registrar dos veces el mismo documento, la UNGRD audita con cruces con la Registraduría y los consejos territoriales verifican en terreno. El plazo hasta el 4-sep (Circular 076) busca evitar exclusiones.",
   "vacios": "No informa resultados: duplicados detectados, registros depurados o inconsistencias con la Registraduría. La pregunta se transcribe y responde dos veces (numerales 6 y 7 del oficio).",

   "numero": "7 (numeral 8 del oficio)",

   "texto": "¿Cómo se ha dado la coordinación de la UNGRD con las acciones misionales que deben realizar las entidades que conforman el Sistema Nacional de Gestión del Riesgo?",

   "resumen": "Se activaron la Sala de Crisis Nacional y sesionaron el Comité Nacional de Manejo y el CNGRD. Se asignaron roles: USAR con el Ejército y Bomberos, albergues y agua con Defensa Civil y Cruz Roja, conectividad con MinTIC, atención aeromédica con las Fuerzas Militares. En recuperación, la coordinación se hace en el PAE (Ley 1523, arts. 61 y 62).",
   "vacios": "No da fechas ni número de sesiones, salvo la del 10-ago, que se informa en la pregunta 15.",

   "n": 1,
   "texto": "¿Cómo coordina la UNGRD con las acciones de la Primera Dama y su fundación, y qué medidas preventivas toma frente a una posible duplicidad y suplantación de funciones misionales?",
   "eje": "ayudas_donaciones",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "Las iniciativas de actores no gubernamentales, 'fundaciones o gestiones complementarias como las promovidas por la Primera Dama', se canalizan 'de manera subordinada e integrada' por los PMU, la Sala de Crisis y el Grupo de Cooperación Internacional. Para prevenir duplicidad, la EDAN y el RUD validados son el único insumo para focalizar las ayudas.",
   "vacios": "No da evidencia de la canalización (actas, PMU con la fundación, registros). Contradice el oficio del 6-nov, según el cual la UNGRD 'no ha establecido mecanismos de coordinación con la Primera Dama o con la fundación' [2026EE20941, p. 8], y el del 16-oct ('no ha tramitado donaciones con la fundación') [2026EE19137, p. 8].",

   "n": 1,
   "texto": "¿Cuál fue el criterio para incluir los departamentos en la declaratoria de situación de desastre del artículo 1 del Decreto 1171 de 2026?",
   "eje": "articulacion_territorial",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "El CNGRD adoptó la declaratoria porque las afectaciones superaron la capacidad territorial. Se incluyeron los departamentos que reportaron afectaciones hasta el Reporte Situacional No. 4 del 10-ago-2026 (corte 17:45), considerando municipios y familias afectadas, vivienda, salud, vías, servicios públicos e información de los PMU.",
   "vacios": "Da la fuente (Reporte No. 4, corte 17:45 del 10-ago) pero no la lista de departamentos ni las cifras del reporte, que no se adjunta. La transcripción de la pregunta fecha el decreto el '10 de agosto'; el decreto es del 11-ago. El texto repite cuatro veces 'situación de'.",

   "eje": "articulacion_territorial",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "Putumayo reportó afectaciones preliminares el 10-ago-2026 por WhatsApp a CITEL y formalizó una base de datos el 14-ago por correo. Norte de Santander reportó el 10-ago por WhatsApp y el 12-ago envió por correo el informe preliminar y la base. Las cifras están en el Reporte Preliminar No. 4. La inclusión inicial respondió al principio de precaución.",
   "vacios": "No dice si alguno de los dos departamentos declaró calamidad pública, que era la primera parte de cada pregunta. No informa cifras de afectación de ninguno. Sobre Putumayo omite el informe del CDGRD del 20-ago-2026 que descartó la relación con el sismo, informado después [2026EE20941, p. 9].",

   "texto": "¿Cuál será el mecanismo de entrega de recursos a los entes territoriales, conforme al artículo 8 del Decreto 1171 del 11 de agosto de 2026?",
   "eje": "recursos_presupuesto",
   "tipo": "PARCIAL",
   "traslada_a": null,
   "resumen": "El FNGRD es el principal mecanismo financiero. La UNGRD adelanta las actuaciones para materializar la transferencia del art. 8. El FNGRD ordenó transferencias directas para el apoyo económico temporal de vivienda al FIC de Alta Liquidez de Fiduprevisora, por las Resoluciones 0767, 0768, 0769, 0770, 0771 y 0774 de 2026, 'que se relacionan a continuación'.",
   "vacios": "Anuncia una relación de resoluciones 'a continuación' que no aparece: el texto pasa directo al párrafo siguiente [pp. 6-7]. No da valores, que solo aparecen en el oficio del 16-oct ($42.814.211.108) [2026EE19137, p. 13].",

   "id": "UNGRD-VP12",

  {

   "entidad": "UNGRD",
   "grupo": "previa",

   "vacios": "No dice si los comités se conformaron ni cuántas sesiones o informes hay. El oficio del 6-nov describe un mecanismo distinto: revisión de informes y constancias de pago [2026EE20941, p. 10].",

  {

   "entidad": "UNGRD",

   "numero": "14 (numeral 15 del oficio)",
   "n": 1,
   "texto": "¿Qué criterios se han definido para la priorización y distribución de los recursos destinados a la atención y recuperación de los territorios afectados por el terremoto?",
   "eje": "recursos_presupuesto",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "Se aplican los principios de coordinación, concurrencia y subsidiariedad. La distribución atiende a la magnitud de afectaciones según la EDAN y el RUD, y prioriza ayuda humanitaria de emergencia, apoyo económico temporal de vivienda y soporte técnico en las zonas de mayor impacto.",

   "id": "UNGRD-VP14",

   "entidad": "UNGRD",
   "grupo": "previa",

   "n": 1,
   "texto": "¿Cómo se han articulado con las entidades del Sistema, los otros sectores y los entes territoriales, en el proceso de rescate y de recuperación?",
   "eje": "articulacion_territorial",
   "tipo": "COMPLETA",
   "traslada_a": null,
   "resumen": "Sala de Crisis y CITEL activas las 24 horas, PMU nacionales y territoriales, Comité Nacional de Manejo del 10-ago y sesión extraordinaria del CNGRD presidida por el Presidente. Despliegue USAR: 54 grupos (16 equipos nacionales con 779 rescatistas, 4 misiones internacionales con 138 rescatistas de EE. UU., Ecuador e Israel y 34 grupos de socorro) en Chocó, Pereira y Cali, con 356 rescatados con vida y 259 cuerpos recuperados. 50 equipos de conectividad satelital con MinTIC, 3 carpas y una planta eléctrica para el Hospital Santa Mónica de Dosquebradas, y un helicóptero trasladado de Carepa a Quibdó. Para la recuperación describe la EDAN, mesas con ministerios y la Subcuenta SISMO 2026, con el PAE 'en formulación'.",
   "vacios": "Es la respuesta más detallada del oficio, aunque sin fecha de corte. Hay 4 misiones internacionales pero solo 3 países. El oficio del 16-oct habla de Ecuador, Israel y El Salvador [2026EE19137, p. 11]. Afirma que la recuperación se financia desde la Subcuenta SISMO 2026 [p. 9], pero el 16-oct la UNGRD dice que esa subcuenta no tiene recursos del PGN [2026EE19137, p. 12].",
   "pagina": "7",
   "id": "UNGRD-VP15",
   "num": 15
  },
  {
   "doc": "UNGRD-18037",
   "entidad": "UNGRD",
   "grupo": "previa",

   "texto": "¿Cómo coordina la UNGRD con los ministerios de Vivienda, Educación y Salud el seguimiento de la información, los reportes y la construcción del PAE de los departamentos afectados?",
   "eje": "PAE",
   "tipo": "GENÉRICA/NORMATIVA",
   "traslada_a": null,
   "resumen": "El PAE se elabora con base en la EDAN (Ley 1523, arts. 61 y 62; Decreto 1171, art. 3) y no es un acto unilateral de la UNGRD. La EDAN 'se encuentra en construcción' por parte de los territorios.",
   "vacios": "No describe ninguna actividad con los tres ministerios. El oficio del 6-nov sí da fechas con MinVivienda: mesas del 18 y 28-sep y base de datos compartida el 19-sep [2026EE20941, p. 12], anteriores a este oficio.",

   "id": "UNGRD-VP16",

  },

   "vacios": "No hay fecha de corte. El oficio no informa capacidad ni entidad administradora por albergue; eso está en el Excel no adjunto. Las cifras de Risaralda no cuadran con el total (ver alertas).",

   "resumen": "La atención de déficits en los alojamientos es responsabilidad de los gobiernos locales, y 'se sugiere remitir este requerimiento a los CMGRD' de los municipios.",
   "vacios": "Lo que se pregunta son los mecanismos de seguimiento de la propia UNGRD, y no los describe. El oficio del 6-nov sí describe instrumentos de la UNGRD (Survey123, lista de chequeo, Manual Esfera) [2026EE20941, p. 14].",

   "citado": "Gerente del Fondo Milagro",
   "preguntas": [
    {
     "id": "FMIL-Q1",
     "orden": 1,
     "pregunta": "¿En qué fecha y con qué radicado respondió el cuestionario aditivo del 4-nov?",
     "si_evade": "Está en trámite.",
     "repregunta": "¿Cuándo lo radicará? Fecha exacta.",
     "soporte": "OD, pp. 15-17",
     "eje": "recursos_presupuesto"
    },
    {
     "id": "FMIL-Q2",
     "orden": 2,
     "pregunta": "¿El Consejo Directivo aprobó el Manual Operativo y el Manual de Contratación? ¿En qué actas?",
     "si_evade": "Están en construcción.",
     "repregunta": "¿Con qué reglas se ha contratado entonces desde el 5-oct?",
     "soporte": "OD, p. 15, pregunta 1",
     "eje": "recursos_presupuesto"
    },
    {
     "id": "FMIL-Q3",
     "orden": 3,
     "pregunta": "¿Cuántas sesiones ha tenido el Consejo Directivo y qué proyectos ha aprobado, con qué montos?",
     "si_evade": "Una sesión de instalación.",
     "repregunta": "¿Algún peso ha llegado a un beneficiario final?",
     "soporte": "UNGRD 2026EE20941, p. 13; OD, p. 17, pregunta 19",
     "eje": "recursos_presupuesto"
    },
    {
     "id": "FMIL-Q4",
     "orden": 4,
     "pregunta": "¿Cuál es el costo mensual de operación del Fondo (comisión, gerencia, equipo)?",
     "si_evade": "Se paga con rendimientos.",
     "repregunta": "¿Cuánto se ha pagado por cada concepto a la fecha?",
     "soporte": "OD, p. 15, pregunta 3; MHCP, p. 2",
     "eje": "recursos_presupuesto"
    },
    {
     "id": "FMIL-Q5",
     "orden": 5,
     "pregunta": "¿Qué metas y montos le asigna el PAE al Fondo, por departamento?",
     "si_evade": "Hay un protocolo de articulación.",
     "repregunta": "¿Está aprobado ese protocolo? Fecha y acta.",
     "soporte": "OD, p. 16, preguntas 11 y 17",
     "eje": "recursos_presupuesto"
    },
    {
     "id": "FMIL-Q6",
     "orden": 6,
     "pregunta": "¿Qué recursos privados ha recibido el Fondo y con qué verificación SARLAFT?",
     "si_evade": "No ha recibido.",
     "repregunta": "Si los recibe, ¿quién hace la verificación y con qué procedimiento escrito?",
     "soporte": "OD, p. 17, pregunta 23",
     "eje": "recursos_presupuesto"
    },
    {
     "id": "FMIL-Q7",
     "orden": 7,
     "pregunta": "¿Se entregarán datos personales del RUD a privados?",
     "si_evade": "Se protegerán los datos.",
     "repregunta": "¿Existe un acuerdo de tratamiento de datos firmado? Fecha.",
     "soporte": "OD, p. 17, pregunta 24",
     "eje": "censo_RUD_RUPE"
    }
   ]
  },
  "AMAYA": {
   "citado": "Director General de la UNGRD · aditiva del H. S. Amaya (El Niño)",
   "preguntas": [
    {
     "id": "AMY-Q1",
     "orden": 1,
     "pregunta": "¿Cuál es el diagnóstico de la UNGRD después del Boletín 7 del 9 de octubre?",
     "si_evade": "El IDEAM es la autoridad técnica.",
     "repregunta": "¿Cuántos municipios y cuántas personas están expuestos en el pico previsto entre diciembre y marzo?",
     "soporte": "UNGRD 2026EE20942, pp. 1-2",
     "eje": "el_nino"
    },
    {
     "id": "AMY-Q2",
     "orden": 2,
     "pregunta": "El Decreto 0802 declaró el desastre nacional por 12 meses desde el 23 de julio. ¿Por qué no hay PAE casi cuatro meses después?",
     "si_evade": "La declaratoria es preventiva; el PAE se formula cuando haya afectaciones.",
     "repregunta": "En la página 28 su respuesta dice que ya se definieron las «líneas generales del PAE». ¿Existe o no existe?",
     "soporte": "UNGRD 2026EE20942, pp. 3-4 y 28",
     "eje": "el_nino"
    },
    {
     "id": "AMY-Q3",
     "orden": 3,
     "pregunta": "¿Cuántos pesos tiene hoy la subcuenta «Fenómeno del Niño 2026-2027», y existe o no existe?",
     "si_evade": "Hay una medida cautelar del Consejo de Estado.",
     "repregunta": "¿Cuál es el número del proceso y la fecha del auto? ¿Qué otra fuente se ha gestionado desde entonces?",
     "soporte": "UNGRD 2026EE20942, pp. 4-5",
     "eje": "el_nino"
    },
    {
     "id": "AMY-Q4",
     "orden": 4,
     "pregunta": "¿Cuáles son los municipios prioritarios para la intervención nacional?",
     "si_evade": "La UNGRD no prioriza; lo hacen los territorios.",
     "repregunta": "La Línea 5 de su propia Estrategia ordena un documento de priorización de municipios. ¿Cuándo lo entrega?",
     "soporte": "UNGRD 2026EE20942, pp. 14, 24-25 y 37",
     "eje": "el_nino"
    },
    {
     "id": "AMY-Q5",
     "orden": 5,
     "pregunta": "Boyacá tiene 59 municipios en riesgo alto o muy alto de desabastecimiento, el segundo departamento del país. ¿Qué recursos ha asignado la UNGRD a Boyacá y en qué estado está su solicitud?",
     "si_evade": "Está en estudio y verificación documental.",
     "repregunta": "¿Desde qué fecha está en estudio, por qué monto y cuándo se decide?",
     "soporte": "UNGRD 2026EE20942, pp. 9 y 15",
     "eje": "el_nino"
    },
    {
     "id": "AMY-Q6",
     "orden": 6,
     "pregunta": "¿Qué parte de los convenios con la Policía ($11.740 millones) y la Fuerza Aeroespacial ($19.500 millones) se ha destinado a El Niño?",
     "si_evade": "Son convenios de fortalecimiento general del Sistema.",
     "repregunta": "¿Cuánto se ha ejecutado en horas de vuelo y operaciones contra incendios desde el 23 de julio?",
     "soporte": "UNGRD 2026EE20942, pp. 15-16",
     "eje": "el_nino"
    },
    {
     "id": "AMY-Q7",
     "orden": 7,
     "pregunta": "Su respuesta dice que distribuyó 80 carrotanques y la infografía de la misma página suma 76. ¿Cuántos son y dónde están?",
     "si_evade": "Se distribuyeron en 22 departamentos.",
     "repregunta": "¿Puede entregar la lista por municipio y decir cuántos municipios en riesgo muy alto no tienen ninguno?",
     "soporte": "UNGRD 2026EE20942, p. 19",
     "eje": "el_nino"
    },
    {
     "id": "AMY-Q8",
     "orden": 8,
     "pregunta": "Si El Niño se intensifica, ¿cuánta capacidad adicional, en pesos y en equipos, necesita la UNGRD y quién la financia?",
     "si_evade": "Se activa el Protocolo Nacional de Respuesta.",
     "repregunta": "¿Con qué recursos disponibles hoy cuenta para atender a la vez incendios y desabastecimiento?",
     "soporte": "UNGRD 2026EE20942, pp. 22-23",
     "eje": "el_nino"
    }
   ]
  }

  root.querySelectorAll("[data-nota]").forEach(t=>{let to;t.addEventListener("input",()=>{clearTimeout(to);to=setTimeout(()=>{const v=t.value.trim();if(v)NOTAS[t.dataset.nota]={texto:v,hora:new Date().toISOString()};else delete NOTAS[t.dataset.nota];store.set("notas",NOTAS);},300);});});
  root.querySelectorAll("[data-addc]").forEach(b=>b.addEventListener("click",()=>{const f=root.querySelector(`[data-cform="${CSS.escape(b.dataset.addc)}"]`);f.hidden=!f.hidden;if(!f.hidden)f.querySelector("[data-ct]").focus();}));
  root.querySelectorAll("[data-csave]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.csave;const f=root.querySelector(`[data-cform="${CSS.escape(id)}"]`);const t=f.querySelector("[data-ct]").value.trim();
    if(!t){f.querySelector("[data-ct]").focus();return;}
    COMP.push({id:"K"+Date.now(),q:id,ent:b.dataset.ent,texto:t,resp:f.querySelector("[data-cr]").value.trim(),plazo:f.querySelector("[data-cp]").value.trim(),fecha:new Date().toISOString(),estado:"Pendiente",limite:"",obs:""});
    store.set("compromisos",COMP);f.querySelector("[data-ct]").value="";f.querySelector("[data-cp]").value="";f.hidden=true;
    const c=root.querySelector(`[data-ccount="${CSS.escape(id)}"]`);if(c)c.textContent="✔ "+plural(compCount(id),"compromiso registrado","compromisos registrados");}));}
document.addEventListener("keydown",ev=>{if(debKey)debKey(ev);});
function cardsFor(e){const out=[];const B=DATA.banco[e];
  if(e==="AMAYA"){B.preguntas.forEach(q=>out.push({type:"q",q,ent:e,kind:`Pregunta ${q.orden} de ${B.preguntas.length} · El Niño`}));DATA.contradicciones.filter(c=>c.expediente==="el_nino").forEach(c=>out.push({type:"c",c,kind:"Contradicción en la respuesta · "+c.tipo}));return out;}
  if(B)B.preguntas.slice().sort((a,b)=>a.orden-b.orden).forEach(q=>out.push({type:"q",q,ent:e,kind:`Pregunta ${q.orden} de ${B.preguntas.length} · ${ejeN(q.eje,true)}`}));
  DATA.contradicciones.filter(c=>c.expediente==="sismo"&&c.entidades.includes(e)).forEach(c=>out.push({type:"c",c,kind:"Contradicción documentada · "+c.tipo}));
  return out;}
function dcard(d,i,n){
  if(d.type==="q"){const q=d.q,done=!!FORM[q.id];
    return `<article class="dcard" aria-roledescription="tarjeta" aria-label="${i+1} de ${n}"><div class="kq">${esc(d.kind)}${done?' <span class="rec">Formulada</span>':""}</div><p class="q">${esc(q.pregunta)}</p>
    <div class="acts"><button type="button" class="btn small" data-copy="${esc(q.pregunta)}">Copiar pregunta</button><label><input type="checkbox" data-form="${esc(q.id)}"${done?" checked":""}> Formulada</label></div>
    <div class="blk"><h4>Respuesta evasiva probable</h4><p>«${esc(q.si_evade)}»</p></div>
    <div class="blk"><h4>Repregunta</h4><p>${esc(q.repregunta)}</p><div class="acts"><button type="button" class="btn ghost small" data-copy="${esc(q.repregunta)}">Copiar repregunta</button></div></div>
    <div class="blk live"><h4>Lo que respondió el funcionario</h4><textarea data-nota="${esc(q.id)}" rows="3" placeholder="Notas rápidas durante la intervención…" aria-label="Notas sobre la respuesta">${esc((NOTAS[q.id]||{}).texto||"")}</textarea>
      <div class="acts"><button type="button" class="btn small" data-addc="${esc(q.id)}">＋ Compromiso adquirido</button><span class="srcd" data-ccount="${esc(q.id)}">${compCount(q.id)?"✔ "+plural(compCount(q.id),"compromiso registrado","compromisos registrados"):""}</span></div>
      <div class="cform" data-cform="${esc(q.id)}" hidden><input data-ct placeholder="¿A qué se comprometió?" aria-label="Compromiso"><input data-cr value="${esc(respDe(d.ent))}" aria-label="Responsable" placeholder="Responsable"><input data-cp placeholder="Plazo (p. ej., 10 días hábiles)" aria-label="Plazo"><button type="button" class="btn small" data-csave="${esc(q.id)}" data-ent="${esc(d.ent)}">Guardar compromiso</button></div></div>
    <p class="srcd">Soporte: ${esc(q.soporte)}</p></article>`;}
  const c=d.c;const vals=[["Versión A",c.a],["Versión B",c.b]].concat(c.c?[["Versión C",c.c]]:[]);const rel=(c.preguntas||[]).map(x=>BQ[x]).filter(Boolean)[0];
  return `<article class="dcard" aria-roledescription="tarjeta" aria-label="${i+1} de ${n}"><div class="kq">${esc(d.kind)}</div><p class="q">${esc(c.tema)}</p>
  <div class="vs2">${vals.map(([w,v])=>`<div class="fig"><div style="font-size:.74rem;font-weight:800;text-transform:uppercase;color:#53655B">${w}</div><div style="font-weight:800">${esc(v.valor)}</div><div class="src" style="color:#53655B;margin-top:4px">Fuente: ${esc(v.fuente)}</div></div>`).join("")}</div>
  ${c.nota?`<div class="blk"><h4>Lectura</h4><p>${esc(c.nota)}</p></div>`:""}
  ${rel?`<div class="blk"><h4>Pregunta</h4><p>${esc(rel.pregunta)}</p></div>`:""}</article>`;}
function openDebate(e){
  if(!e||!(DATA.entidades[e]||(e==="AMAYA"&&DATA.banco.AMAYA)))e=DATA.banco.AMAYA?"AMAYA":(F.ent!=="ALL"?F.ent:ENT[0]);
  const E=e==="AMAYA"?{citado:"Preguntas del H. S. Amaya a la UNGRD (El Niño)"}:DATA.entidades[e];const deck=cardsFor(e);
  const tabs=(DATA.banco.AMAYA?`<button type="button" role="tab" class="amy" aria-selected="${e==="AMAYA"}" data-dent="AMAYA">★ H. S. Amaya · El Niño</button>`:"")+ENT.map(x=>{const p=DATA.entidades[x].estado!=="respondió";return `<button type="button" role="tab" class="${p?"p":""}" aria-selected="${x===e}" data-dent="${x}">${esc(DATA.entidades[x].citado)}${p?" (sin respuesta)":""}</button>`;}).join("");
  const dv=$("#debate");dv.hidden=false;document.body.style.overflow="hidden";
  dv.innerHTML=`<div class="dbh"><h2 id="dbTitle">Modo debate · ${esc(E.citado)}</h2>
  <div class="timer" id="tmr" role="timer" aria-label="Tiempo de intervención"><span id="tmrT">00:00</span><span id="tmrG" class="tg"></span><button type="button" class="btn small" id="tmrGo" aria-pressed="false">▶ Iniciar</button><button type="button" class="btn ghost small" id="tmrRs" aria-label="Reiniciar cronómetro">↺</button><button type="button" class="btn ghost small" id="tmrTg" aria-label="Cambiar tiempo objetivo">${TMR.target} min</button></div>
  <a class="btn ghost small" href="#acta">Acta</a><button type="button" class="btn ghost small" id="dbClose">Cerrar ✕</button></div>
  <div class="dtabs" role="tablist" aria-label="Citados">${tabs}</div>
  <div class="track" id="track" tabindex="0" aria-label="Tarjetas: deslice o use las flechas">${deck.map((d,i)=>dcard(d,i,deck.length)).join("")||'<article class="dcard"><p class="q">Sin tarjetas para este citado.</p></article>'}</div>
  <div class="dnav"><button type="button" class="btn ghost" id="dPrev">← Anterior</button><span id="dCount" aria-live="polite"></span><button type="button" class="btn" id="dNext">Siguiente →</button></div>`;
  bindQ(dv);bindLive(dv);tmrBind();markText(dv);
  const tr=$("#track");const n=Math.max(1,deck.length);const idx=()=>Math.round(tr.scrollLeft/tr.clientWidth);
  const upd=()=>{if(!$("#dCount"))return;$("#dCount").textContent=(idx()+1)+" / "+n;$("#dPrev").disabled=idx()<=0;$("#dNext").disabled=idx()>=n-1;};
  const go=i=>tr.scrollTo({left:Math.max(0,Math.min(n-1,i))*tr.clientWidth,behavior:"smooth"});
  tr.addEventListener("scroll",()=>{clearTimeout(tr._t);tr._t=setTimeout(upd,60);});
  $("#dPrev").addEventListener("click",()=>go(idx()-1));$("#dNext").addEventListener("click",()=>go(idx()+1));
  dv.querySelectorAll("[data-dent]").forEach(b=>b.addEventListener("click",()=>location.replace("#debate/"+b.dataset.dent)));
  $("#dbClose").addEventListener("click",()=>{location.hash=prevHash||"#inicio";});
  debKey=ev=>{if($("#debate").hidden)return;if(ev.target.closest&&ev.target.closest(".dtabs,input,textarea"))return;if(ev.key==="ArrowRight"){go(idx()+1);ev.preventDefault();}if(ev.key==="ArrowLeft"){go(idx()-1);ev.preventDefault();}if(ev.key==="Escape")location.hash=prevHash||"#inicio";};
  upd();setTimeout(()=>{const t=dv.querySelector('[aria-selected="true"]');if(t)t.scrollIntoView({inline:"center",block:"nearest"});tr.focus();},30);
  renderLevels(-1);}
function closeDebate(){debKey=null;clearInterval(tmrInt);const dv=$("#debate");if(!dv.hidden){dv.hidden=true;dv.innerHTML="";document.body.style.overflow="";}}
$("#bDebate").addEventListener("click",()=>{if(!/^#debate/.test(location.hash))prevHash=location.hash||"#inicio";});

const TDEF={"COMPLETA":"Responde lo preguntado con datos verificables y su fuente.","PARCIAL":"Responde una parte, o sin el detalle pedido (territorio, cifras, fechas o responsables).","GENÉRICA/NORMATIVA":"Describe normas, competencias o procedimientos sin responder el hecho preguntado.","REMISIÓN A PORTAL/ANEXO":"Remite a un portal, tablero o anexo en lugar de responder. Se registra como REMISIÓN SIN RESPUESTA SUSTANTIVA.","TRASLADO POR COMPETENCIA":"Envía la pregunta a otra entidad.","NO RESPONDE":"No se refiere a la pregunta.","SIN RESPUESTA":"No hay oficio de respuesta en el expediente revisado."};
function vMetodo(){const G=DATA.glosario||[];
  return {title:"Método y glosario",crumbs:[{t:"Método y glosario",h:"#metodo"}],html:`<div class="view-h"><div><div class="kicker">Cómo leer este tablero</div><h1>Método y glosario</h1></div></div>
  <div class="two"><div class="grid">

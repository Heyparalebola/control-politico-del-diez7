  <section class="card"><h2>Cómo se clasifican las respuestas</h2><ul class="clean">${TIPOS.map(([k])=>`<li>${tp(k)} <span style="margin-left:6px">${esc(TDEF[k]||"")}</span></li>`).join("")}</ul></section>
  <section class="card"><h2>Índice de calidad de respuesta</h2><p style="margin:0">Completas más la mitad de las parciales, dividido entre las preguntas con respuesta escrita. Es un cálculo UTL que mide lo que contestó el Gobierno, no la gravedad de la situación: un tema puede tener buena calidad de respuesta y un problema grave. Por eso la prioridad se presenta en «Dónde presionar», con su razón escrita.</p></section>
  <section class="card"><h2>Marcas en el texto</h2><ul class="clean"><li><span class="mk mk-hecho">HECHO</span> Consta en un documento, con su fuente entre corchetes.</li><li><span class="mk mk-inf">INFERENCIA</span> Lectura de la UTL a partir de los hechos.</li><li><span class="mk mk-calc">cálculo UTL</span> Operación aritmética de la UTL sobre cifras oficiales.</li><li>${NC} La entidad no entregó el dato. No equivale a cero.</li><li><span class="mk mk-rem">REMISIÓN SIN RESPUESTA SUSTANTIVA</span> La entidad remitió a un portal o anexo en lugar de responder.</li></ul></section>
  <section class="card"><h2>Dónde se guardan sus marcas</h2><p style="margin:0">Las preguntas formuladas, las notas, los compromisos y el estado del seguimiento se guardan solo en este navegador. No se envían a ningún servidor. Para usarlos en otro equipo, exporte el respaldo desde <a href="#seguimiento">Seguimiento</a>.</p></section>
  <section class="card"><h2>Versiones</h2><ul class="tight">${(DATA.meta.changelog||[]).map(c=>`<li><b>v${esc(c.version)}</b> (${fdate(c.fecha)}): ${c.cambios.map(esc).join(" ")}</li>`).join("")}</ul></section>
  </div><section class="card" style="align-self:start"><h2>Glosario de siglas</h2><input type="search" id="gQ" placeholder="Buscar sigla o término…" aria-label="Buscar en el glosario" class="gq"><dl class="glos" id="gL">${G.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl></section></div>`,
  after(){$("#gQ").addEventListener("input",e=>{const t=e.target.value.toLowerCase();document.querySelectorAll("#gL>div").forEach(d=>d.hidden=!!t&&!d.textContent.toLowerCase().includes(t));});}};}
/* ================= Marcas HECHO / INFERENCIA / cálculo UTL ================= */
const MKRE=/(REMISIÓN SIN RESPUESTA SUSTANTIVA|cálculo UTL|cálculo propio|INFERENCIA|HECHO)/;
function markText(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentNode;if(!p||p.closest("script,style,textarea,input,button,svg,.mk,option,select,.csel-list"))return NodeFilter.FILTER_REJECT;return MKRE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const parts=n.nodeValue.split(MKRE);const f=document.createDocumentFragment();parts.forEach(p=>{if(!p)return;if(MKRE.test(p)&&p.match(MKRE)[0]===p){const s=document.createElement("span");s.className="mk "+(p==="INFERENCIA"?"mk-inf":p==="HECHO"?"mk-hecho":p.startsWith("REMISIÓN")?"mk-rem":"mk-calc");s.textContent=p;f.appendChild(s);}else f.appendChild(document.createTextNode(p));});n.parentNode.replaceChild(f,n);});}
/* ================= Menú desplegable propio (reemplaza el selector nativo) ================= */
function enhanceSelect(sel){
  if(!sel||sel.dataset.enh)return;sel.dataset.enh="1";
  const wrap=document.createElement("span");wrap.className="csel";sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(sel);
  sel.classList.add("csel-native");sel.tabIndex=-1;sel.setAttribute("aria-hidden","true");
  const btn=document.createElement("button");btn.type="button";btn.className="csel-btn";btn.setAttribute("aria-haspopup","listbox");btn.setAttribute("aria-expanded","false");
  const lab=sel.getAttribute("aria-label")||(document.querySelector(`label[for="${sel.id}"]`)||{}).textContent||"";if(lab)btn.setAttribute("aria-label",lab.trim());
  const list=document.createElement("div");list.className="csel-list";list.setAttribute("role","listbox");list.hidden=true;
  wrap.append(btn,list);
  function label(){const o=sel.options[sel.selectedIndex];btn.innerHTML=`<span>${esc(o?o.textContent:"")}</span><i aria-hidden="true">▾</i>`;}
  function build(){list.innerHTML=[...sel.options].map((o,i)=>`<button type="button" role="option" data-i="${i}" aria-selected="${i===sel.selectedIndex}">${esc(o.textContent)}</button>`).join("");}
  function open(){document.querySelectorAll(".csel-list:not([hidden])").forEach(l=>{if(l!==list){l.hidden=true;l.previousSibling.setAttribute("aria-expanded","false");}});
    build();list.hidden=false;btn.setAttribute("aria-expanded","true");const r=btn.getBoundingClientRect();list.classList.toggle("right",r.left>innerWidth/2&&innerWidth>760);
    const cur=list.querySelector('[aria-selected="true"]')||list.firstChild;if(cur)cur.focus();}
  function close(focus){list.hidden=true;btn.setAttribute("aria-expanded","false");if(focus)btn.focus();}
  btn.addEventListener("click",e=>{e.stopPropagation();list.hidden?open():close();});
  list.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;e.stopPropagation();sel.selectedIndex=+b.dataset.i;label();close(true);sel.dispatchEvent(new Event("change",{bubbles:true}));});
  list.addEventListener("keydown",e=>{const bs=[...list.querySelectorAll("button")];const i=bs.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();(bs[i+1]||bs[i]).focus();}else if(e.key==="ArrowUp"){e.preventDefault();(bs[i-1]||bs[0]).focus();}else if(e.key==="Escape"||e.key==="Tab"){close(e.key==="Escape");}});
  btn.addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();open();}});
  sel._refresh=label;label();}
function refreshSelects(root){(root||document).querySelectorAll("select").forEach(s=>{enhanceSelect(s);if(s._refresh)s._refresh();});}
document.addEventListener("click",()=>document.querySelectorAll(".csel-list:not([hidden])").forEach(l=>{l.hidden=true;l.previousSibling.setAttribute("aria-expanded","false");}));
/* ================= Búsqueda y filtros ================= */
function fillFilters(){
  $("#fEnt").innerHTML='<option value="ALL">Todas las entidades</option>'+ENT.map(e=>`<option value="${e}">${esc(EN(e))}</option>`).join("");
  $("#fEje").innerHTML='<option value="ALL">Todos los temas</option>'+EJES.map(e=>`<option value="${e}">${esc(ejeN(e,true))}</option>`).join("");
  $("#fTipo").innerHTML='<option value="ALL">Todo tipo de respuesta</option>'+TIPOS.filter(([k])=>k!=="SIN RESPUESTA").map(([k,,i,l])=>`<option value="${esc(k)}">${i} ${esc(l)}</option>`).join("");
  syncControls();}
function syncControls(){$("#fEnt").value=F.ent;$("#fEje").value=F.eje;$("#fTipo").value=F.tipo;$("#fQ").value=F.q;refreshSelects($("#filters"));}
function saveF(){store.set("filters",F);}
function renderChips(){const ch=[];if(F.ent!=="ALL")ch.push(["ent",EN(F.ent)]);if(F.eje!=="ALL")ch.push(["eje",ejeN(F.eje,true)]);if(F.tipo!=="ALL")ch.push(["tipo",TK[F.tipo]?TK[F.tipo].l:F.tipo]);if(F.q)ch.push(["q",'"'+F.q+'"']);
  $("#chips").innerHTML=ch.length?`<span class="src" style="align-self:center">Filtros activos:</span>`+ch.map(([k,t])=>`<span class="chip">${esc(t)}<button type="button" data-rm="${k}" aria-label="Quitar filtro ${esc(t)}">×</button></span>`).join("")+`<button type="button" class="btn ghost small" data-rm="all">Quitar todos</button>`:"";
  $("#chips").style.display=ch.length?"flex":"none";$("#bFilt").textContent=ch.length?`Filtros (${ch.length})`:"Filtros";
  $("#chips").querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.rm;if(k==="all"){F.ent=F.eje=F.tipo="ALL";F.q="";}else if(k==="q")F.q="";else F[k]="ALL";saveF();syncControls();render();}));}
[["fEnt","ent"],["fEje","eje"],["fTipo","tipo"]].forEach(([id,k])=>$("#"+id).addEventListener("change",e=>{F[k]=e.target.value;saveF();render();}));
let tq;$("#fQ").addEventListener("input",e=>{clearTimeout(tq);tq=setTimeout(()=>{F.q=e.target.value.trim().toLowerCase();saveF();showResults();render();},220);});
$("#fQ").addEventListener("focus",showResults);
$("#fQ").addEventListener("keydown",e=>{if(e.key==="Escape")closeResults();if(e.key==="ArrowDown"){const a=$("#results a");if(a){a.focus();e.preventDefault();}}});
$("#results").addEventListener("keydown",e=>{const as=[...$("#results").querySelectorAll("a")];const i=as.indexOf(document.activeElement);if(e.key==="ArrowDown"&&as[i+1]){as[i+1].focus();e.preventDefault();}if(e.key==="ArrowUp"){(as[i-1]||$("#fQ")).focus();e.preventDefault();}if(e.key==="Escape"){closeResults();$("#fQ").focus();}});
document.addEventListener("click",e=>{if(!e.target.closest(".searchwrap"))closeResults();});
function closeResults(){$("#results").classList.remove("on");}
function showResults(){const t=F.q;if(!t||t.length<2){closeResults();return;}
  const has=o=>JSON.stringify(o).toLowerCase().includes(t);
  const ej=EJES.filter(e=>has(DATA.ejes[e])).slice(0,4).map(e=>`<a href="#eje/${e}">${esc(ejeN(e))}</a>`);
  const qs=DATA.preguntas.filter(has).slice(0,8).map(q=>`<a href="#pregunta/${q.id}">${esc(EN(q.entidad))} · P${esc(q.numero)} · ${esc(String(q.texto||"").slice(0,70))}…</a>`);
  const cs=DATA.contradicciones.filter(has).slice(0,5).map(c=>`<a href="#contradiccion/${c.id}">${esc(c.tema)}</a>`);
  const es=ENT.filter(e=>has(DATA.entidades[e])).slice(0,4).map(e=>`<a href="#entidad/${e}">${esc(ENL(e))}</a>`);
  const g=(t2,a)=>a.length?`<div class="grp">${t2}</div>${a.join("")}`:"";
  $("#results").innerHTML=(g("Temas",ej)+g("Preguntas",qs)+g("Contradicciones",cs)+g("Entidades",es))||'<div class="grp">Sin resultados</div>';$("#results").classList.add("on");}
$("#bFilt").addEventListener("click",()=>{const o=$("#apph").classList.toggle("fo");$("#bFilt").setAttribute("aria-expanded",String(o));});
/* ================= Modo ================= */
function setMode(m){MODE=m;store.set("mode",m);document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===m)));render();}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
/* ================= Impresión ================= */
function buildSummary(){
  const l0=vSismo().html;
  const ej=EJES.map(e=>{const s=semEje(e);const t=tally(s.qs);const cf=cifrasEje(e,true).slice(0,3);const hs=ejeContras(e).slice(0,2);const st=strongest(e);
    return `<div class="pe ${s.col}"><h3>${esc(ejeN(e))} · ${SEMW[s.col]}${s.i!==null?" · índice "+fmt(Math.round(s.i*100))+" %":""}</h3>
    <p>${s.n?`${s.n} con respuesta: ${t["COMPLETA"]} completas, ${t["PARCIAL"]} parciales.`:"Sin respuestas en el expediente."}</p>
    ${cf.length?`<p><b>Cifras:</b> ${cf.map(c=>`${cifV(c)} ${esc(c.unidad&&!/^COP/.test(c.unidad)?c.unidad:"")} — ${esc(c.indicador)} (${esc(docRef(c.doc,c.pagina))})`).join("; ")}</p>`:""}
    ${hs.length?`<ul>${hs.map(c=>`<li>${esc(c.tema)}: ${esc(c.a.valor)} vs. ${esc(c.b.valor)}</li>`).join("")}</ul>`:""}
    ${st?`<p><b>Pregunta:</b> ${esc(st.pregunta)}</p>`:""}</div>`;});
  const bq=ENT.map(e=>{const B=DATA.banco[e];if(!B)return "";return `<div class="bq"><h3>${esc(B.citado)}</h3><ol>${B.preguntas.slice().sort((a,b)=>a.orden-b.orden).map(q=>`<li>${FORM[q.id]?"☑":"☐"} ${esc(q.pregunta)} <span class="src">— Repregunta: ${esc(q.repregunta)} [${esc(q.soporte)}]</span></li>`).join("")}</ol></div>`;}).join("");
  const half=Math.ceil(ej.length/2);
  const AQ=DATA.amaya?`<div class="pg"><h2 class="ph">★ Preguntas del ${esc(DATA.amaya.senador)} a la UNGRD (El Niño)</h2><p class="src">Respuesta ${esc(docRef(DATA.amaya.doc))} del ${fdate(DOCS[DATA.amaya.doc].fecha)}. Expediente aparte.</p>
    <div class="msgs">${DATA.amaya.mensajes.map(m=>`<div class="card msg"><div class="big">${esc(m.cifra)}</div><div class="det">${esc(m.detalle)}</div><div class="ctx">${esc(m.mensaje)}</div><div class="src">${esc(m.fuente)}</div></div>`).join("")}</div>
    <ol>${amayaQs().map(q=>`<li><b>${esc((TK[q.tipo]||{}).l||q.tipo)}.</b> ${esc(String(q.texto||"").slice(0,140))}… <span class="src">Vacío: ${esc(String(q.vacios||"—").slice(0,180))} [${esc(docRef(q.doc,q.pagina))}]</span></li>`).join("")}</ol>
    <div class="bq"><h3>Banco de preguntas</h3><ol>${DATA.banco.AMAYA.preguntas.map(q=>`<li>${FORM[q.id]?"☑":"☐"} ${esc(q.pregunta)} <span class="src">— Repregunta: ${esc(q.repregunta)} [${esc(q.soporte)}]</span></li>`).join("")}</ol></div></div>`:"";
  $("#printSummary").innerHTML=AQ+`<div class="pg"><p class="src" style="margin:0 0 4px">${esc(DATA.meta.titulo)} · ${esc(DATA.meta.sesion)} · versión ${esc(DATA.meta.version)} · corte ${fdate(DATA.meta.corte_documentos)}</p>${l0}</div>
  <div class="pg"><h2 class="ph">Los temas (1 de 2)</h2><div class="pej">${ej.slice(0,half).join("")}</div></div>
  <div class="pg"><h2 class="ph">Los temas (2 de 2)</h2><div class="pej">${ej.slice(half).join("")}</div></div>
  <div class="pg"><h2 class="ph">Banco de preguntas por citado</h2>${bq}</div>`;}
$("#bPrintSum").addEventListener("click",()=>{buildSummary();document.body.classList.add("ps");window.print();});
$("#bPrintView").addEventListener("click",()=>{const opened=[...document.querySelectorAll("#view details:not([open])")];opened.forEach(d=>d.open=true);window.print();setTimeout(()=>opened.forEach(d=>d.open=false),600);});
window.addEventListener("afterprint",()=>document.body.classList.remove("ps"));
/* ================= Tooltip de fuente ================= */
const tip=$("#tip");
function showTip(el,x,y){tip.textContent=el.getAttribute("data-src");tip.style.display="block";const r=tip.getBoundingClientRect();tip.style.left=Math.min(x+12,innerWidth-r.width-8)+"px";tip.style.top=(y+16+r.height>innerHeight?y-r.height-10:y+16)+"px";}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-src]");if(el)showTip(el,e.clientX,e.clientY);});
document.addEventListener("mousemove",e=>{const el=e.target.closest("[data-src]");if(el)showTip(el,e.clientX,e.clientY);else tip.style.display="none";});
document.addEventListener("focusin",e=>{const el=e.target.closest("[data-src]");if(el){const r=el.getBoundingClientRect();showTip(el,r.left,r.bottom);}});
document.addEventListener("focusout",()=>tip.style.display="none");
const TOUCH=()=>matchMedia("(hover: none)").matches;
document.addEventListener("click",e=>{if(!TOUCH())return;const el=e.target.closest("[data-src]");if(!el||el.closest("a")){if(tip._pin){tip.style.display="none";tip._pin=null;}return;}
  if(tip._pin===el){tip.style.display="none";tip._pin=null;return;}const r=el.getBoundingClientRect();showTip(el,Math.max(8,r.left),r.bottom);tip._pin=el;},true);
window.addEventListener("scroll",()=>{if(tip._pin){tip.style.display="none";tip._pin=null;}document.body.classList.toggle("compact",window.scrollY>140);},{passive:true});
/* ================= Inicio ================= */
$("#brand").innerHTML=`${esc(DATA.meta.titulo_corto)}<small>${esc(DATA.meta.sesion)} · datos v${esc(DATA.meta.version)} · corte ${fdate(DATA.meta.corte_documentos)}</small>`;
fillFilters();
$("#corte").innerHTML=`Corte ${fdate(DATA.meta.corte_documentos)} · <u>Método</u>`;
document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===MODE)));
window.addEventListener("hashchange",()=>{if(!/^#debate/.test(location.hash)&&location.hash)prevHash=location.hash;});
if(!/^#debate/.test(location.hash))prevHash=location.hash||"#inicio";
render();
})();

</script>
